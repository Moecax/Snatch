name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Test (JVM, Android host, JS, Wasm)
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest :shared:jsTest :shared:wasmJsTest --continue

      - name: Build apps
        run: ./gradlew :androidApp:assembleDebug :desktopApp:jar :webApp:compileProductionExecutableKotlinJs :webApp:compileProductionExecutableKotlinWasmJs
